version: 1

runtime:
  model_name: PP-OCRv6_tiny_rec
  model_source: BOS
  model_cache_dir: models/paddlex
  device: cpu
  # Native Windows must use false. Set true in WSL after install_hpi_deps.
  enable_hpi: false
  enable_mkldnn: true
  cpu_threads: 4
  batch_size: 10
  warmup_iterations: 2
  ocr_hz: 12.0
  queue_size: 2
  realtime: true
  confidence_threshold: 0.80
  padding: 0.08
  aspect_bucket_base: 4.0
  max_rois: 10

temporal:
  fast:
    window: 3
    required: 2
  stable:
    window: 5
    required: 3

fields:
  - field_id: speed
    # Normalized x, y, width, height. Replace these values for the real overlay.
    box: [0.430, 0.780, 0.140, 0.080]
    # Crop only the value, not its label/unit, whenever possible.
    allowed_chars: "0123456789."
    regex: '^\d{1,3}(?:\.\d)?$'
    data_type: float
    decimals: 1
    min_value: 0
    max_value: 400
    profile: fast
    primary:
      name: lab_l_clahe
      channel: lab_l
      scale: 2.0
      clahe: true
      clahe_clip: 2.0
      clahe_grid: 8
      unsharp: true
      unsharp_amount: 0.8
      morphology: none
      morphology_kernel: 3
      threshold: none
      adaptive_block_size: 21
      adaptive_c: 5.0
      invert: false
    fallback:
      name: gray_adaptive
      channel: gray
      scale: 2.0
      clahe: true
      clahe_clip: 2.0
      clahe_grid: 8
      unsharp: true
      unsharp_amount: 0.8
      morphology: none
      morphology_kernel: 3
      threshold: adaptive
      adaptive_block_size: 21
      adaptive_c: 5.0
      invert: false

  - field_id: rpm
    box: [0.735, 0.810, 0.120, 0.060]
    allowed_chars: "0123456789"
    regex: '^\d{1,5}$'
    data_type: integer
    min_value: 0
    max_value: 20000
    profile: fast
    primary:
      name: hsv_v_clahe
      channel: hsv_v
      scale: 2.0
      clahe: true
      unsharp: true
    fallback:
      name: gray_otsu
      channel: gray
      scale: 2.0
      clahe: true
      unsharp: true
      threshold: otsu

  - field_id: gear
    box: [0.600, 0.820, 0.050, 0.060]
    allowed_chars: "PRND123456"
    regex: '^(?:P|R|N|D|[1-6])$'
    data_type: string
    profile: stable
    primary:
      name: color_clahe
      channel: color
      scale: 2.0
      clahe: true
      unsharp: true
    fallback:
      name: lab_l_blackhat
      channel: lab_l
      scale: 2.0
      clahe: true
      unsharp: true
      morphology: blackhat
      threshold: none
