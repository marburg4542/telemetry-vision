# SUPERSEDED — kept for reference, used by nothing.
#
# The working config for 15-31-25-0.mp4 before calibration produced
# roi_calibrated.yaml. No code, script or document points at it, and its runtime
# settings are older than the shipped ones: ocr_hz 12.0 against 10.1,
# cpu_threads 4, confidence_threshold 0.80, and no recognizer_workers at all.
#
# Its ROI boxes are frozen at that moment too, so they drift further from the
# calibrated config every time those are refined. Use roi_calibrated.yaml, or
# roi_calibrated_cuda.yaml on a GPU.
version: 1

runtime:
  model_name: PP-OCRv6_tiny_rec
  model_source: BOS
  model_cache_dir: models/paddlex
  device: cpu
  enable_hpi: false
  enable_mkldnn: true
  cpu_threads: 4
  batch_size: 12
  warmup_iterations: 2
  ocr_hz: 12.0
  queue_size: 2
  realtime: true
  confidence_threshold: 0.80
  padding: 0.02
  aspect_bucket_base: 4.0
  max_rois: 12

temporal:
  fast:
    window: 3
    required: 2
  stable:
    window: 5
    required: 3

fields:
  - field_id: timestamp
    box: [0.035, 0.102, 0.078, 0.032]
    allowed_chars: "0123456789:"
    regex: '^\d{2}:\d{2}:\d{2}$'
    data_type: string
    derive_from_source_time: true
    profile: stable
    primary: &primary
      name: lab_l_clahe
      channel: lab_l
      scale: 2.0
      clahe: true
      unsharp: true
    fallback: &fallback
      name: gray_adaptive
      channel: gray
      scale: 2.0
      clahe: true
      unsharp: true
      threshold: adaptive

  - field_id: eo_detail
    box: [0.062, 0.137, 0.145, 0.034]
    allowed_chars: "0123456789.xXFOV°"
    regex: '^\d{1,2}\.\d[xX]F[O0]V\d{1,3}\.\d°?$'
    data_type: string
    normalizer: optics
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: ir_detail
    box: [0.062, 0.168, 0.065, 0.034]
    allowed_chars: "0123456789.xX"
    regex: '^\d{1,2}\.\d[xX]$'
    data_type: string
    normalizer: optics
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: lrf_m
    box: [0.070, 0.194, 0.050, 0.034]
    allowed_chars: "0123456789."
    regex: '^\d{1,4}\.\d$'
    data_type: float
    normalizer: numeric
    decimals: 1
    min_value: 0
    max_value: 9999
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: sensor_angle_deg
    box: [0.465, 0.075, 0.075, 0.035]
    allowed_chars: "+-0123456789."
    regex: '^[+-]?\d{1,3}\.\d{2}$'
    data_type: float
    normalizer: numeric
    decimals: 2
    min_value: -180
    max_value: 180
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: elevation_deg
    box: [0.061, 0.480, 0.054, 0.040]
    allowed_chars: "+-0123456789."
    regex: '^[+-]?\d{1,3}\.\d{2}$'
    data_type: float
    normalizer: numeric
    decimals: 2
    min_value: -90
    max_value: 90
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: tag_lat_dms
    box: [0.875, 0.742, 0.120, 0.034]
    allowed_chars: "0123456789.°'\""
    regex: '^\d{1,2}°\d{2}\x27\d{2}\.\d{2}\x22$'
    data_type: dms
    normalizer: dms
    dms_degrees_digits: 2
    dms_decimal_places: 2
    hemisphere: N
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: tag_lon_dms
    box: [0.875, 0.772, 0.120, 0.034]
    allowed_chars: "0123456789.°'\""
    regex: '^\d{1,3}°\d{2}\x27\d{2}\.\d{2}\x22$'
    data_type: dms
    normalizer: dms
    dms_degrees_digits: 3
    dms_decimal_places: 2
    hemisphere: E
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: tag_alt_m
    box: [0.915, 0.802, 0.080, 0.034]
    allowed_chars: "0123456789.mM"
    regex: '^\d{1,4}\.\d{3}$'
    data_type: float
    normalizer: numeric
    decimals: 3
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: acft_lat_dms
    box: [0.875, 0.902, 0.120, 0.034]
    allowed_chars: "0123456789.°'\""
    regex: '^\d{1,2}°\d{2}\x27\d{2}\.\d{2}\x22$'
    data_type: dms
    normalizer: dms
    dms_degrees_digits: 2
    dms_decimal_places: 2
    hemisphere: N
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: acft_lon_dms
    box: [0.875, 0.932, 0.120, 0.034]
    allowed_chars: "0123456789.°'\""
    regex: '^\d{1,3}°\d{2}\x27\d{2}\.\d{2}\x22$'
    data_type: dms
    normalizer: dms
    dms_degrees_digits: 3
    dms_decimal_places: 2
    hemisphere: E
    profile: fast
    primary: *primary
    fallback: *fallback

  - field_id: acft_alt_m
    box: [0.915, 0.962, 0.080, 0.032]
    allowed_chars: "0123456789.mM"
    regex: '^\d{1,4}\.\d{3}$'
    data_type: float
    normalizer: numeric
    decimals: 3
    profile: fast
    primary: *primary
    fallback: *fallback
