# Where the project finds models, videos and datasets.
#
# Checkpoints and training metrics live inside the working tree because tooling
# needs them on every run. Note "working tree", not "git": .gitignore excludes
# models/ and *.pt, so a fresh clone has the registry below but none of the
# files it names — `vision-lab check` lists which are actually present. The
# source videos, extracted frames and Roboflow dataset are ~8 GB and stay
# outside the project entirely; `asset_root` is how the CLI finds those.
#
# Every path is either absolute or relative to the repository root, except the
# entries under `asset_dirs`, which are relative to `asset_root`.
version: 1

# Overridable with the TELEMETRY_VISION_ASSETS environment variable.
asset_root: ../object_detection

# The folder the web app lists in its video dropdown. Relative to the
# repository root (absolute paths are allowed), and overridable with the
# TELEMETRY_OCR_VIDEOS environment variable. Separate from asset_dirs.videos
# below, which is where the CLI's dataset work reads the original footage from:
# the app is used by operators who copy in the clip they want to look at, and
# asking them to put it in the training corpus was the wrong place for it.
video_dir: videos

asset_dirs:
  videos: data
  frames: dataset_frames
  dataset: car-detection-3
  detection_runs: video_results

# Short names accepted anywhere a checkpoint is expected, so that commands do
# not carry six-segment paths. `vision-lab models` prints this table.
models:
  best50: models/yolo/best.pt
  best01: models/yolo/best01.pt
  yolov8n: models/yolo/yolov8n.pt
  run4: runs/visdrone_custom_4th/weights/best.pt
  run6: runs/visdrone_custom_6th/weights/best.pt
  run7: runs/visdrone_custom_7th/weights/best.pt

# best50 is the 50-epoch checkpoint. It is the default because it is the only
# one measured to return detections on the target footage; see README.
default_model: best50
