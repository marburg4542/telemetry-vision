[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-ocr"
version = "0.3.3"
description = "CPU-first real-time telemetry extraction from fixed video ROIs with PaddleOCR"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Telemetry OCR contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-contrib-python==4.10.0.84",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.7,<3.8"]
web = ["aiohttp>=3.10,<4"]
ai = [
  "ultralytics>=8.3,<9",
  "dill>=0.3.8,<1",
  "lap>=0.5.12,<1",
  # Keep the standard and contrib wheels aligned. PaddleOCR requires contrib,
  # while Ultralytics declares the standard distribution.
  "opencv-python==4.10.0.84",
]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]
lint = ["ruff>=0.6,<1", "mypy>=1.11,<2", "types-PyYAML>=6,<7"]

[project.scripts]
telemetry-ocr = "telemetry_ocr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telemetry_ocr = [
  "web_static/*.html",
  "web_static/*.css",
  "web_static/*.js",
  "web_static/*.webmanifest",
  "web_static/icons/*.png",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # The heavy dependencies are imported lazily inside functions on purpose, so
  # that validate-config and the unit tests run without an ML stack installed.
  "E402",
  # Repairing glyphs an OSD font renders ambiguously is what this project does;
  # the en dashes, primes and degree signs in string literals are the subject
  # matter, not typos.
  "RUF001",
]

[tool.mypy]
files = ["src/telemetry_ocr"]
python_version = "3.10"
# cv2, paddleocr, torch and ultralytics have no usable stubs here, and the
# frame/image types they exchange are deliberately Any at the boundaries.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
